<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fde3ee">
<link rel="icon" href="data:,">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hangman">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Hangman</title>
<style>
/* The skin's own markup lays out as if it sat straight in <body>. */
#hm-root{display:contents}
/* Layout of the shared settings form; each skin styles the look. */
.hm-opts,.hm-cats{display:flex;flex-wrap:wrap;gap:8px}
.hm-opt{position:relative;display:inline-flex}
.hm-opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.hm-opt input:focus-visible + span{outline:2px solid currentColor;outline-offset:2px}
.hm-switchrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
</style>
</head>
<body>
<div id="hm-root"></div>
<!-- words:begin --><!-- words:end -->
<!-- build:skins -->
<script>Hangman.boot();</script>
<script>
/* Offline install; where registration fails (file://, an old browser) the game simply runs uncached. */
try { navigator.serviceWorker.register("sw.js").catch(function(){}); } catch (e) {}
</script>
</body>
</html>
